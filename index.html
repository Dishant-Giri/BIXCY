<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIXCY App Icon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Outer preview container */
    .icon-wrapper {
      padding: 24px;
    }

    /* App icon rounded squircle card */
    .app-icon {
      width: 320px;
      height: 320px;
      background-color: #ffffff;
      border-radius: 72px; /* iOS-style continuous corner curvature */
      box-shadow: 
        0 10px 25px rgba(0, 0, 0, 0.05),
        0 20px 48px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
    }

    .icon-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* Vespa SVG styling */
    .scooter-svg {
      width: 175px;
      height: auto;
      fill: #b4622b; /* Copper orange */
    }

    /* Olive branch wreath styling */
    .wreath-svg {
      width: 110px;
      height: auto;
      fill: #6b7a3a; /* Olive green */
      margin-top: 14px;
      margin-bottom: 12px;
    }

    /* Text label */
    .app-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #000000;
      text-transform: uppercase;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="icon-wrapper">
    <div class="app-icon">
      <div class="icon-content">
        
        <!-- Vespa Scooter Silhouette -->
        <svg class="scooter-svg" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
          <!-- Main Body, Floorboard, Steering Column & Headlight -->
          <path d="

            L 110,32 
            C 107,31 106,33 108,35 
            L 120,44 
            L 115,70 
            L 88,71 
            C 86,52 75,51 60,51 
            L 60,49 
            C 60,47 62,47 70,47 
            C 75,47 77,44 77,41 
            L 76,40 
            C 75,37 72,37 60,37 
            C 48,37 45,39 45,43 
            C 45,45 47,47 50,47 
            L 52,48 
            C 46,52 38,57 36,66 
            L 32,67 
            C 30,67 29,69 30,71 
            L 31,74 
            C 31,86 42,94 58,94

            C 68,91 71,88 77,88 
            C 83,88 86,91 87,94

            C 122,94 126,88 127,81

            C 153,92 161,84 163,73 
            C 165,60 155,52 143,52 
            L 137,52 
            L 129,32

          " />
          
          <!-- Rear Wheel -->
          <circle cx="58" cy="98" r="18" />
          <circle cx="58" cy="98" r="7.5" fill="#ffffff" />
          
          <!-- Front Wheel -->
          <circle cx="147" cy="98" r="18" />
          <circle cx="147" cy="98" r="7.5" fill="#ffffff" />
          
          <!-- Cowl Accent Cutout -->
          <path d="M 64,88 C 66,74 54,65 42,65 C 49,63 68,66 73,88 Z" fill="#ffffff" />
        </svg>

        <!-- Olive Wreath (Cyprus style) -->
        <svg class="wreath-svg" viewBox="0 0 160 45" xmlns="http://www.w3.org/2000/svg">
          <!-- Left Branch Stem -->
          <path d="M 75,32 C 55,30 35,22 20,8" fill="none" stroke="#6b7a3a" stroke-width="2.5" stroke-linecap="round" />

        </svg>

        <!-- Brand Name -->
        <span class="app-title">BIXCY</span>
      </div>
    </div>
  </div>

</body>
</html>
